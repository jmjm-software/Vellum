name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push cancels the running android build for the same ref. Tag builds
# (release APKs) are never cancelled.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # release asset upload on tags
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Decide what actually needs building: app sources (APK) vs tests only
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'android/app/src/main/**'
              - 'android/app/build.gradle.kts'
              - 'android/build.gradle.kts'
              - 'android/settings.gradle.kts'
              - 'android/gradle.properties'
              - 'android/gradle/wrapper/**'
              - 'android/gradlew'
              - 'android/gradlew.bat'
              - '.github/workflows/android.yml'
            tests:
              - 'android/app/src/test/**'
              - 'android/app/build.gradle.kts'
              - 'android/build.gradle.kts'
              - '.github/workflows/android.yml'

  # ---------------------------------------------------------------------------
  # Native widget tests + widget previews (run whenever android code changes)
  # ---------------------------------------------------------------------------
  native-tests:
    name: native widget tests
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Real Android toolchain. The runner image already ships cmdline-tools;
      # install the platform/build-tools directly (multi-arg, so sdkmanager
      # resolves each package — comma-joined strings fail). Idempotent.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::sdkmanager not found"; exit 1; }
          sudo sh -c "yes | '$SDKM' --licenses" >/dev/null 2>&1 || true
          sudo sh -c "'$SDKM' 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run native widget tests
        working-directory: android
        env:
          # AGP resolves the debug keystore under ANDROID_USER_HOME; the runner
          # sets XDG_CONFIG_HOME, which maps it to a non-writable path.
          ANDROID_USER_HOME: "${{ runner.temp }}/.android"
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload native widget previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellum-widget-previews
          path: android/app/build/widget-previews
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native widget test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellum-widget-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # APK: only when the app itself changed (test-only changes skip this job)
  # ---------------------------------------------------------------------------
  apk:
    name: build APK
    needs: changes
    if: needs.changes.outputs.app == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::sdkmanager not found"; exit 1; }
          sudo sh -c "yes | '$SDKM' --licenses" >/dev/null 2>&1 || true
          sudo sh -c "'$SDKM' 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + lint
        working-directory: android
        env:
          ANDROID_USER_HOME: "${{ runner.temp }}/.android"
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellum-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellum-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      # Attach the APK to a GitHub Release when a version tag is pushed.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
