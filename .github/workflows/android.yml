name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # release asset upload on tags
  actions: read

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Real Android toolchain. The runner image already ships cmdline-tools;
      # install the platform/build-tools directly (multi-arg, so sdkmanager
      # resolves each package — comma-joined strings fail). Idempotent.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "::error::sdkmanager not found"; exit 1; }
          sudo sh -c "yes | '$SDKM' --licenses" >/dev/null 2>&1 || true
          sudo sh -c "'$SDKM' 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'"

      # Gradle wrapper + build cache (wrapper downloads the pinned 8.10.2).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + lint
        working-directory: android
        env:
          # AGP resolves the debug keystore under ANDROID_USER_HOME; the runner
          # sets XDG_CONFIG_HOME, which maps it to a non-writable path. Pin it
          # to a guaranteed-writable location so validateSigningDebug succeeds.
          ANDROID_USER_HOME: "${{ runner.temp }}/.android"
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellum-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellum-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      # Attach the APK to a GitHub Release when a version tag is pushed.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk