name: container

# Dashboard service image. Path-filtered: this workflow only runs when inputs of
# the service image change (the native widget renderer has its own workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packages/**"
      - "scripts/container-entrypoint.sh"
      - "Containerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/container-entrypoint.sh"
      - "Containerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/container.yml"
  workflow_dispatch:

# A new push supersedes a running build of the same image (no resource waste).
# Never cancel a tag/release build.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Full acceptance suite on the host before any image is pushed
  # ---------------------------------------------------------------------------
  test:
    name: build + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Install chromium for the preview worker
        run: npx playwright install --with-deps chromium

      - name: E2E acceptance suite
        run: |
          bash scripts/stack-up.sh /tmp/vellum-ci
          node scripts/e2e.mjs
          bash scripts/stack-down.sh

      - name: MCP integration test
        env:
          VELLUM_DATA_DIR: /tmp/vellum-ci-mcp
        run: |
          bash scripts/stack-up.sh /tmp/vellum-ci-mcp
          node scripts/mcp-test.mjs
          bash scripts/stack-down.sh

  # ---------------------------------------------------------------------------
  # Build one architecture per job (native runners, no QEMU), push by digest
  # ---------------------------------------------------------------------------
  image:
    name: build linux/${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase; github.repository keeps the
      # original case (e.g. jmjm-software/Vellum).
      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

      - name: Build linux/${{ matrix.arch }}${{ github.event_name != 'pull_request' && ' & push by digest' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=service-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.arch }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,push=true', env.REGISTRY, steps.image.outputs.name) || '' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-service-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-arch digests into one multi-arch manifest list, tag it, smoke it
  # ---------------------------------------------------------------------------
  manifest:
    name: merge manifest + smoke (amd64)
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-service-*
          merge-multiple: true
          path: /tmp/digests

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest list
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          echo "arch digests: $(ls | wc -l)"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'sha256:%s ' *)

      # Smoke-test the pushed multi-arch tag: on this amd64 runner the daemon
      # resolves the amd64 manifest; the arm64 manifest is smoked separately.
      - name: Smoke test pushed image (amd64)
        run: |
          SHORT="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker run -d --name vellum-smoke -p 8787:8787 "${REGISTRY}/${{ steps.image.outputs.name }}:${SHORT}"
          for i in $(seq 1 45); do
            curl -sf localhost:8787/api/health > /dev/null && break
            sleep 2
          done
          curl -sf localhost:8787/api/health
          node scripts/e2e.mjs
          docker logs vellum-smoke --tail 40

      - name: Container logs on failure
        if: failure()
        run: docker logs vellum-smoke --tail 200 || true

  # ---------------------------------------------------------------------------
  # The arm64 manifest runs chromium + better-sqlite3 natively: smoke it too
  # ---------------------------------------------------------------------------
  smoke-arm64:
    name: smoke (arm64)
    runs-on: ubuntu-24.04-arm
    needs: manifest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Smoke test pushed image (arm64)
        run: |
          SHORT="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${{ steps.image.outputs.name }}:${SHORT}"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'platform: {{.Os}}/{{.Architecture}}'
          docker run -d --name vellum-smoke -p 8787:8787 "$IMAGE"
          for i in $(seq 1 60); do
            curl -sf localhost:8787/api/health > /dev/null && break
            sleep 2
          done
          curl -sf localhost:8787/api/health
          node scripts/e2e.mjs
          docker logs vellum-smoke --tail 40

      - name: Container logs on failure
        if: failure()
        run: docker logs vellum-smoke --tail 200 || true
